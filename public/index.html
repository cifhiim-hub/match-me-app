<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatchMe AI | מערכת השמה חכמה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --p: #3b82f6; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg); color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .glass { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        
        /* אנימציות צ'אט */
        .msg-enter { animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        input, select, textarea { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; width: 100%; padding: 16px; border-radius: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p) !important; background: rgba(59,130,246,0.1) !important; }
        
        .btn-main { background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 16px; border-radius: 16px; font-weight: 800; text-align: center; box-shadow: 0 4px 15px rgba(37,99,235,0.3); transition: 0.2s; }
        .btn-main:active { transform: scale(0.95); }

        .chat-bubble-bot { background: rgba(59,130,246,0.15); border-radius: 16px 16px 0 16px; padding: 12px 16px; border: 1px solid rgba(59,130,246,0.2); margin-left: 20%; color: #bfdbfe; }
        .chat-bubble-user { background: #2563eb; border-radius: 16px 16px 16px 0; padding: 12px 16px; margin-right: 20%; color: white; font-weight: bold; }
        
        .view-section { display: none; min-height: 100vh; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 glass !rounded-none border-x-0 border-t-0 p-4 flex justify-between items-center bg-slate-900/80">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-black italic text-lg shadow-lg shadow-blue-500/20">M</div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase leading-none">Match<span class="text-blue-500">Me</span></h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-wide">השמה חכמה</p>
            </div>
        </div>
        <div id="u-badge" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-bold">אורח</div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-6">
        
        <section id="v-feed" class="view-section active">
            <div class="mb-6 relative">
                <input type="text" id="search-input" placeholder="חפש משרה, עיר או תחום..." class="pl-10">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            </div>
            
            <div id="feed-list" class="space-y-4">
                <div class="text-center py-10 opacity-50"><i class="fa-solid fa-circle-notch fa-spin"></i> טוען משרות...</div>
            </div>
        </section>

        <section id="v-post" class="view-section">
            <div class="glass p-6">
                <h2 class="text-2xl font-black mb-1 text-center">פרסום משרה חכמה</h2>
                <p class="text-center text-xs text-blue-400 mb-6 font-bold">ה-AI שלנו יסנן עבורך את המועמדים</p>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 mr-2">כותרת המשרה</label>
                        <input id="p-title" type="text" placeholder="למשל: נהג חלוקה עד 15 טון">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-400 mr-2">מיקום</label>
                            <input id="p-location" type="text" placeholder="עיר/אזור">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 mr-2">טלפון וואטסאפ</label>
                            <input id="p-phone" type="tel" placeholder="050...">
                        </div>
                    </div>

                    <div class="bg-blue-600/10 p-4 rounded-2xl border border-blue-500/20">
                        <h3 class="font-bold text-sm text-blue-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-robot"></i> הגדרות ל-AI (הסוכן)</h3>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">שכר שעתי מקסימלי (ש"ח)</label>
                                <input id="p-salary-max" type="number" placeholder="כמה אתה מוכן לשלם?">
                            </div>
                            
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">שאלת סינון קריטית (כן/לא)</label>
                                <input id="p-must-have" type="text" placeholder="למשל: האם יש לך רישיון ג'?">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400">שאלת ניסיון</label>
                                <input id="p-exp-q" type="text" placeholder="למשל: כמה שנים אתה בתחום?">
                            </div>
                        </div>
                    </div>

                    <button onclick="Data.submitPost()" id="btn-submit" class="btn-main w-full mt-4">הפעל סוכן ופרסם</button>
                </div>
            </div>
        </section>

        <section id="v-profile" class="view-section">
            <div id="login-box" class="glass p-8 text-center">
                <i class="fa-solid fa-user-astronaut text-4xl text-blue-500 mb-4"></i>
                <h3 class="text-xl font-bold mb-4">התחברות למערכת</h3>
                <input id="auth-email" type="email" placeholder="אימייל" class="mb-3">
                <input id="auth-pass" type="password" placeholder="סיסמה" class="mb-4">
                <button onclick="Auth.login()" class="btn-main w-full">כנס</button>
            </div>
            <div id="user-box" class="hidden text-center glass p-6">
                <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto mb-3 flex items-center justify-center text-xl font-bold" id="user-initial">?</div>
                <h3 id="user-email" class="font-bold mb-6"></h3>
                <h4 class="text-right text-xs font-bold opacity-50 mb-2 mr-2">ההיסטוריה שלי</h4>
                <div id="my-posts" class="space-y-3"></div>
                <button onclick="Auth.logout()" class="text-red-400 text-xs font-bold mt-6">התנתק</button>
            </div>
        </section>

    </main>

    <div id="chat-modal" class="fixed inset-0 z-[2000] bg-slate-900/95 backdrop-blur-sm hidden flex-col">
        <div class="p-4 bg-slate-800/50 flex justify-between items-center border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-cyan-400 rounded-full flex items-center justify-center"><i class="fa-solid fa-headset text-white text-sm"></i></div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-slate-900"></div>
                </div>
                <div>
                    <h3 class="font-bold text-sm leading-tight">הסוכן של MatchMe</h3>
                    <p class="text-[10px] text-blue-300">מנהל משא ומתן בזמן אמת</p>
                </div>
            </div>
            <button onclick="ChatBot.close()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <div class="p-4 bg-slate-800/80 border-t border-white/5">
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="כתוב כאן..." onkeypress="if(event.key === 'Enter') ChatBot.userReply()">
                <button onclick="ChatBot.userReply()" class="bg-blue-600 w-12 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass h-16 flex justify-around items-center z-50 shadow-2xl shadow-black/50">
        <button onclick="Router.go('feed')" class="nav-btn active text-blue-500 flex flex-col items-center gap-1"><i class="fa-solid fa-layer-group text-lg"></i><span class="text-[9px] font-bold">לוח</span></button>
        <button onclick="Router.go('post')" class="nav-btn text-slate-500 flex flex-col items-center gap-1"><div class="w-12 h-12 bg-blue-600 rounded-full -mt-10 border-[5px] border-[#0f172a] flex items-center justify-center text-white shadow-lg shadow-blue-500/40"><i class="fa-solid fa-plus text-xl"></i></div></button>
        <button onclick="Router.go('profile')" class="nav-btn text-slate-500 flex flex-col items-center gap-1"><i class="fa-solid fa-user-shield text-lg"></i><span class="text-[9px] font-bold">אישי</span></button>
    </nav>

<script type="module">
    // Firebase Setup
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, deleteDoc, doc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD0hsz8SOI1OG2Fh-DBy1SHeabPaEKZx-Y",
        authDomain: "matchme-32bcf.firebaseapp.com",
        projectId: "matchme-32bcf",
        storageBucket: "matchme-32bcf.appspot.com",
        appId: "1:1082863959305:web:f888f4df815598696c601f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let allPosts = [];

    // --- מערכת צ'אט בוט חכמה (The Negotiator) ---
    window.ChatBot = {
        currentPost: null,
        step: 0,
        data: {},
        
        open(post) {
            this.currentPost = post;
            this.step = 0;
            this.data = {};
            document.getElementById('chat-modal').classList.remove('hidden');
            document.getElementById('chat-modal').classList.add('flex');
            document.getElementById('chat-messages').innerHTML = '';
            
            // הודעת פתיחה
            this.botSay(`היי! אני הסוכן הדיגיטלי של ${post.location}. המטרה שלי היא לחבר אותך למעסיק בצורה הכי מהירה. מוכן?`, 500);
            setTimeout(() => this.nextStep(), 1500);
        },

        close() {
            document.getElementById('chat-modal').classList.add('hidden');
            document.getElementById('chat-modal').classList.remove('flex');
        },

        botSay(text, delay = 0) {
            const area = document.getElementById('chat-messages');
            
            // סימולציית הקלדה
            const typingId = 'typing-' + Date.now();
            setTimeout(() => {
                const typingDiv = document.createElement('div');
                typingDiv.id = typingId;
                typingDiv.className = 'chat-bubble-bot w-16 flex items-center justify-center gap-1 msg-enter';
                typingDiv.innerHTML = '<div class="w-1.5 h-1.5 bg-blue-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-blue-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-blue-400 rounded-full typing-dot"></div>';
                area.appendChild(typingDiv);
                area.scrollTop = area.scrollHeight;

                // החלפה להודעה אמיתית
                setTimeout(() => {
                    document.getElementById(typingId).remove();
                    const div = document.createElement('div');
                    div.className = 'chat-bubble-bot msg-enter';
                    div.innerText = text;
                    area.appendChild(div);
                    area.scrollTop = area.scrollHeight;
                }, 1000); // זמן הקלדה מדומה
            }, delay);
        },

        userReply() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            const area = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-bubble-user msg-enter ml-auto';
            div.innerText = txt;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            
            input.value = '';
            this.handleInput(txt);
        },

        nextStep() {
            const p = this.currentPost;
            
            if (this.step === 0) {
                this.botSay(`קודם כל, שאלה קריטית: ${p.mustHave || "האם המשרה רלוונטית לך?"}`);
            } else if (this.step === 1) {
                this.botSay(`מצוין. ושאלה מקצועית: ${p.expQuestion || "כמה ניסיון יש לך בתחום?"}`);
            } else if (this.step === 2) {
                this.botSay(`עכשיו נדבר תכלס - כסף. מה השכר השעתי שאתה מצפה לקבל?`);
            } else if (this.step === 3) {
                this.finishNegotiation();
            }
        },

        handleInput(txt) {
            this.data[`step_${this.step}`] = txt;
            
            // לוגיקת סינון בזמן אמת
            if (this.step === 0) { // שאלת חובה
                if (txt.includes('לא') || txt.includes('אין')) {
                    this.botSay("אני מבין. המעסיק הגדיר את זה כתנאי חובה, אז לצערי זה לא יתאים הפעם. אבל אני שומר אותך למשרות אחרות! 🙏");
                    setTimeout(() => this.close(), 4000);
                    return;
                }
            }
            
            if (this.step === 2) { // שכר
                const asked = parseInt(txt.replace(/\D/g, ''));
                const max = parseInt(this.currentPost.maxSalary);
                
                if (asked && max && asked > max + 5) {
                    this.botSay(`שמע, זה קצת מעל התקציב (הגג הוא ${max}), אבל אם אתה תותח אולי הוא יתגמש. בוא ננסה לחבר ביניכם.`);
                } else if (asked) {
                    this.botSay("נשמע בול בתקציב! ✅");
                }
            }

            this.step++;
            setTimeout(() => this.nextStep(), 1000);
        },

        finishNegotiation() {
            const p = this.currentPost;
            const answers = this.data;
            
            // בניית הודעת וואטסאפ חכמה
            let waMsg = `*שלום, הסוכן של MatchMe מצא התאמה!* 🤖\n\n`;
            waMsg += `לגבי המשרה: *${p.title}*\n`;
            waMsg += `----------------\n`;
            waMsg += `✅ *${p.mustHave}:* ${answers['step_0']}\n`;
            waMsg += `💼 *ניסיון:* ${answers['step_1']}\n`;
            waMsg += `💰 *ציפיות שכר:* ${answers['step_2']}\n`;
            waMsg += `----------------\n`;
            waMsg += `המועמד עבר את הסינון הראשוני. מתי אפשר להתקשר?`;

            const link = `https://wa.me/972${p.phone.replace(/\D/g,'').replace(/^0/,'')}?text=${encodeURIComponent(waMsg)}`;

            this.botSay("זהו, יש לנו התאמה! 🎉 אני שולח את כל הפרטים למעסיק עכשיו בוואטסאפ. לחץ על הכפתור למטה:");
            
            setTimeout(() => {
                const area = document.getElementById('chat-messages');
                const btn = document.createElement('div');
                btn.className = 'msg-enter mt-4 text-center';
                btn.innerHTML = `<a href="${link}" target="_blank" class="inline-block bg-green-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-green-600 transition-all transform hover:scale-105"><i class="fa-brands fa-whatsapp text-xl ml-2"></i> שלח למעסיק לסגירה</a>`;
                area.appendChild(btn);
                area.scrollTop = area.scrollHeight;
            }, 1500);
        }
    };

    // --- לוגיקה כללית (Router, UI, Data) ---
    window.Router = {
        go(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('v-'+viewId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-blue-500', 'active');
                el.classList.add('text-slate-500');
            });
            // Update active nav icon color logic could be added here
            
            if(viewId === 'feed') Data.loadPosts();
        }
    };

    window.Data = {
        async submitPost() {
            if (!currentUser) return alert("חובה להתחבר כדי לפרסם");
            
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מעבד נתונים...';
            
            const post = {
                title: document.getElementById('p-title').value,
                location: document.getElementById('p-location').value,
                phone: document.getElementById('p-phone').value,
                maxSalary: document.getElementById('p-salary-max').value,
                mustHave: document.getElementById('p-must-have').value,
                expQuestion: document.getElementById('p-exp-q').value,
                owner: currentUser.uid,
                createdAt: serverTimestamp()
            };

            if(!post.title || !post.phone) {
                alert("חסרים פרטים");
                btn.innerHTML = 'הפעל סוכן ופרסם';
                return;
            }

            try {
                await addDoc(collection(db, "smart_posts"), post);
                alert("המשרה פורסמה והסוכן מוכן לעבודה!");
                Router.go('feed');
                // ניקוי טופס
                document.querySelectorAll('input').forEach(i => i.value = '');
            } catch (e) {
                alert("שגיאה: " + e.message);
            } finally {
                btn.innerHTML = 'הפעל סוכן ופרסם';
            }
        },

        async loadPosts() {
            const list = document.getElementById('feed-list');
            list.innerHTML = '<div class="text-center py-10 opacity-50"><i class="fa-solid fa-circle-notch fa-spin"></i> טוען משרות...</div>';
            
            const q = query(collection(db, "smart_posts"), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            allPosts = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
            
            if (allPosts.length === 0) {
                list.innerHTML = '<div class="text-center py-10 opacity-30">אין משרות פעילות כרגע</div>';
                return;
            }

            list.innerHTML = allPosts.map(p => `
                <div class="glass p-5 border-r-4 border-blue-500 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-20 h-20 bg-blue-500/10 rounded-full blur-2xl -translate-x-10 -translate-y-10 group-hover:bg-blue-500/20 transition-all"></div>
                    
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-1 rounded-md font-bold mb-2 inline-block">משרה חכמה</span>
                            <h3 class="text-xl font-black text-white leading-tight mb-1">${p.title}</h3>
                            <p class="text-sm font-bold text-slate-400"><i class="fa-solid fa-location-dot ml-1"></i> ${p.location}</p>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-white/5 flex gap-3">
                        <button onclick='ChatBot.open(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="flex-1 bg-white/5 hover:bg-white/10 py-3 rounded-xl text-sm font-bold border border-white/10 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-comments text-blue-400"></i> צ'אט עם הסוכן
                        </button>
                    </div>
                </div>
            `).join('');
        },

        async loadMyHistory() {
            if(!currentUser) return;
            const q = query(collection(db, "smart_posts"), where("owner", "==", currentUser.uid));
            const snap = await getDocs(q);
            const myContainer = document.getElementById('my-posts');
            myContainer.innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `<div class="bg-white/5 p-3 rounded-xl text-right text-xs flex justify-between items-center">
                    <span class="font-bold">${p.title}</span>
                    <button onclick="Data.deletePost('${d.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            }).join('');
        },
        
        async deletePost(id) {
            if(confirm("למחוק?")) {
                await deleteDoc(doc(db, "smart_posts", id));
                this.loadMyHistory();
            }
        }
    };

    window.Auth = {
        async login() {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch { alert("שגיאה בהתחברות"); }
        },
        async logout() { await signOut(auth); }
    };

    // Listeners
    onAuthStateChanged(auth, u => {
        currentUser = u;
        if (u) {
            document.getElementById('u-badge').innerText = 'מחובר';
            document.getElementById('u-badge').classList.add('text-green-400');
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('user-box').classList.remove('hidden');
            document.getElementById('user-email').innerText = u.email;
            document.getElementById('user-initial').innerText = u.email[0].toUpperCase();
            Data.loadMyHistory();
        } else {
            document.getElementById('u-badge').innerText = 'אורח';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('user-box').classList.add('hidden');
        }
        Data.loadPosts(); // טוען משרות בכל מקרה
    });

    // חיפוש
    document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = allPosts.filter(p => p.title.toLowerCase().includes(val) || p.location.toLowerCase().includes(val));
        // פונקציית רינדור מקוצרת לצורך הדוגמה (במציאות עדיף לפצל את הרינדור לפונקציה נפרדת)
        // כאן הקוד פשוט יטען מחדש הכל אם ריק
        if(!val) Data.loadPosts();
    });

</script>
