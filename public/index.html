<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatchMe AI V3 | דשבורד חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --p: #6366f1; --bg: #0f172a; --card: rgba(30, 41, 59, 0.85); }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg); color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .glass { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        
        /* אנימציות */
        .msg-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* אלמנטים */
        input, select, textarea { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; width: 100%; padding: 16px; border-radius: 16px; outline: none; transition: 0.3s; font-size: 16px; }
        input:focus { border-color: var(--p) !important; background: rgba(99, 102, 241, 0.1) !important; }
        
        .btn-main { background: linear-gradient(135deg, #6366f1, #4f46e5); padding: 16px; border-radius: 16px; font-weight: 800; text-align: center; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); transition: 0.2s; color: white; }
        .btn-main:active { transform: scale(0.96); }

        /* צ'אט */
        .chat-bubble-bot { background: rgba(99, 102, 241, 0.15); border-radius: 18px 18px 2px 18px; padding: 14px 18px; border: 1px solid rgba(99, 102, 241, 0.2); margin-left: 15%; color: #e0e7ff; font-size: 0.95rem; line-height: 1.5; }
        .chat-bubble-user { background: #4f46e5; border-radius: 18px 18px 18px 2px; padding: 12px 18px; margin-right: 15%; color: white; font-weight: 600; font-size: 0.95rem; }
        
        .view-section { display: none; min-height: 100vh; padding-bottom: 120px; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { background: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
       .tab-inactive { background: rgba(255,255,255,0.05); color: #94a3b8; }
 /* אנימציות למודאלים החדשים */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

.apply-shake { 
    animation: shake 0.2s ease-in-out 0s 2; 
    border-color: #ef4444 !important; /* הופך את הגבול לאדום בזמן רעידה */
}

/* אפקט כניסה חלקה (Zoom & Fade) */
.animate-in {
    animation-duration: 0.3s;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
}

.zoom-in {
    animation-name: zoomIn;
}

@keyframes zoomIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

/* עיצוב רשימת הצעות הערים (Autocomplete) */
#city-suggestions {
    max-height: 200px;
    overflow-y: auto;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}

#city-suggestions div {
    transition: all 0.2s ease;
}

#city-suggestions div:hover {
    padding-right: 20px; /* אפקט קטן כשעוברים על עיר */
}
        
    </style>
</head>
<body>

    <header class="sticky top-0 z-40 glass !rounded-none border-x-0 border-t-0 p-4 flex justify-between items-center bg-slate-900/90 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-black italic text-lg shadow-lg shadow-indigo-500/20 text-white">M</div>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase leading-none">Match<span class="text-indigo-400">Me</span></h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-widest">SMART HIRING</p>
            </div>
        </div>
        <div id="u-badge" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-bold flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-slate-500" id="u-dot"></div> <span>אורח</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-6">
        
        <section id="v-feed" class="view-section active">
            <div class="mb-4 relative group">
                <input type="text" id="search-input" placeholder="חפש משרה, עיר או מקצוע..." class="pl-10 group-focus-within:border-indigo-500">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
            </div>
            
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="Data.filterByCategory('all')" class="bg-indigo-600 text-white px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-lg shadow-indigo-500/30">✨ הכל</button>
                <button onclick="Data.filterByCategory('biz')" class="bg-white/5 border border-white/10 px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap hover:bg-white/10">💼 משרות</button>
                <button onclick="Data.filterByCategory('user')" class="bg-white/5 border border-white/10 px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap hover:bg-white/10">🙋‍♂️ עובדים</button>
            </div>
            
            <div id="feed-list" class="space-y-4 pb-20">
                <div class="text-center py-20 opacity-50"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500"></i><br>טוען נתונים...</div>
            </div>
        </section>

        <section id="v-post" class="view-section">
            <div class="glass p-6">
                <h2 class="text-2xl font-black mb-6 text-center">יצירת כרטיס חכם</h2>
                
                <div class="flex gap-2 mb-6 p-1.5 bg-black/20 rounded-2xl">
                    <button onclick="UI.togglePostType('biz')" id="tab-biz" class="flex-1 py-3 rounded-xl font-bold tab-active transition-all">💼 מגייס</button>
                    <button onclick="UI.togglePostType('user')" id="tab-user" class="flex-1 py-3 rounded-xl font-bold tab-inactive transition-all">🙋‍♂️ מחפש</button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 mr-2 mb-1 block">כותרת ראשית</label>
                        <input id="p-title" type="text" placeholder="למשל: דרוש נהג חלוקה">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-400 mr-2 mb-1 block">מיקום</label>
                            <input id="p-location" type="text" placeholder="תל אביב">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 mr-2 mb-1 block">וואטסאפ</label>
                            <input id="p-phone" type="tel" placeholder="050...">
                        </div>
                    </div>

                    <div class="bg-indigo-500/10 p-5 rounded-2xl border border-indigo-500/20 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-indigo-500/20 rounded-full blur-xl"></div>
                        <h3 class="font-bold text-sm text-indigo-300 mb-2 flex items-center gap-2"><i class="fa-solid fa-robot"></i> הנחיות לסוכן ה-AI</h3>
                        
                        <div class="space-y-3 mt-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">תקציב / שכר (ש"ח)</label>
                                <input id="p-salary-max" type="number" placeholder="50">
                            </div>
                            
                            <div>
                                <label class="text-[10px] font-bold text-slate-400">שאלת סף (תנאי חובה)</label>
                                <input id="p-must-have" type="text" placeholder="למשל: האם יש ניסיון?">
                            </div>
                        </div>
                    </div>

                    <button onclick="Data.submitPost()" id="btn-submit" class="btn-main w-full mt-4 text-lg">פרסם עכשיו 🚀</button>
                </div>
            </div>
        </section>

        <section id="v-profile" class="view-section">
            <div id="login-box" class="glass p-8 text-center mt-10">
                <div class="w-20 h-20 bg-indigo-500/20 rounded-full mx-auto mb-4 flex items-center justify-center border border-indigo-500/30">
                    <i class="fa-solid fa-fingerprint text-3xl text-indigo-400"></i>
                </div>
                <h3 class="text-2xl font-black mb-2">הזדהות</h3>
                <p class="text-sm text-slate-400 mb-6">התחבר כדי לנהל את המשרות והפניות שלך</p>
                
                <input id="auth-email" type="email" placeholder="כתובת אימייל" class="mb-3">
                <input id="auth-pass" type="password" placeholder="סיסמה" class="mb-6">
                
                <div class="flex gap-3">
                    <button onclick="Auth.login()" class="btn-main flex-1">כניסה</button>
                    <button onclick="Auth.register()" class="bg-white/5 hover:bg-white/10 text-white font-bold py-3 px-6 rounded-xl border border-white/10 transition-all">הרשמה</button>
                </div>
            </div>
            
            <div id="user-box" class="hidden">
                <div class="glass p-6 mb-6 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-xl font-bold shadow-lg" id="user-initial">A</div>
                        <div>
                            <h3 class="font-bold text-lg leading-tight">שלום רב,</h3>
                            <p id="user-email" class="text-xs text-indigo-300"></p>
                        </div>
                    </div>
                    <button onclick="Auth.logout()" class="w-10 h-10 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500/20 transition-all"><i class="fa-solid fa-power-off"></i></button>
                </div>

                <div class="flex gap-4 mb-4 border-b border-white/10 pb-2">
                    <button onclick="UI.switchProfileTab('posts')" id="subtab-posts" class="text-sm font-bold pb-2 text-indigo-400 border-b-2 border-indigo-400">הפרסומים שלי</button>
                    <button onclick="UI.switchProfileTab('inbox')" id="subtab-inbox" class="text-sm font-bold pb-2 text-slate-500 border-b-2 border-transparent">הודעות שהתקבלו 📥</button>
                </div>
                
                <div id="tab-content-posts">
                    <div id="my-posts" class="space-y-3"></div>
                </div>

                <div id="tab-content-inbox" class="hidden">
                    <div id="my-inbox" class="space-y-3"></div>
                </div>
            </div>
        </section>

    </main>

    <div id="chat-modal" class="fixed inset-0 z-[2000] bg-slate-950/90 backdrop-blur-sm hidden flex-col">
        <div class="p-4 bg-slate-900 flex justify-between items-center border-b border-white/10 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-headset text-white text-sm"></i></div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-slate-900 animate-pulse"></div>
                </div>
                <div>
                    <h3 class="font-bold text-sm leading-tight text-white">הסוכן החכם</h3>
                    <p class="text-[10px] text-indigo-300">בשיחה לגבי: <span id="chat-subject" class="text-white">...</span></p>
                </div>
            </div>
            <button onclick="ChatBot.close()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <div class="p-4 bg-slate-900 border-t border-white/10">
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="הקלד הודעה..." class="!bg-slate-800 !border-slate-700" onkeypress="if(event.key === 'Enter') ChatBot.userReply()">
                <button onclick="ChatBot.userReply()" class="bg-indigo-600 w-14 rounded-xl flex items-center justify-center text-white hover:bg-indigo-500 transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass h-16 flex justify-around items-center z-50 shadow-2xl shadow-black/50 border border-white/10">
        <button onclick="Router.go('feed')" class="nav-btn active text-indigo-400 flex flex-col items-center gap-1 transition-all"><i class="fa-solid fa-layer-group text-xl"></i><span class="text-[9px] font-bold">לוח</span></button>
        <button onclick="Router.go('post')" class="nav-btn text-slate-500 flex flex-col items-center gap-1 transition-all hover:text-white">
            <div class="w-14 h-14 bg-indigo-600 rounded-full -mt-10 border-[6px] border-[#0f172a] flex items-center justify-center text-white shadow-lg shadow-indigo-600/40 hover:scale-110 transition-transform"><i class="fa-solid fa-plus text-2xl"></i></div>
        </button>
        <button onclick="Router.go('profile')" class="nav-btn text-slate-500 flex flex-col items-center gap-1 transition-all hover:text-white"><i class="fa-solid fa-user-circle text-xl"></i><span class="text-[9px] font-bold">אזור אישי</span></button>
    </nav>
<div id="details-modal" class="fixed inset-0 z-[3000] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="glass w-full max-w-sm overflow-hidden animate-in zoom-in duration-300 border border-white/10">
        <div class="p-6">
            <div id="details-badge" class="mb-4 inline-block px-3 py-1 rounded-full text-[10px] font-bold border"></div>
            <h2 id="details-title" class="text-2xl font-black text-white mb-2 leading-tight"></h2>
            
            <div class="space-y-4 mt-6 text-sm">
                <div class="flex items-center gap-3 text-slate-300 bg-white/5 p-3 rounded-xl">
                    <i class="fa-solid fa-location-dot text-indigo-400"></i>
                    <span id="details-loc"></span>
                </div>
                <div class="flex items-center gap-3 text-slate-300 bg-white/5 p-3 rounded-xl">
                    <i class="fa-solid fa-shekel-sign text-indigo-400"></i>
                    <span>שכר: <span id="details-salary" class="font-bold text-white"></span> לשעה</span>
                </div>
                <div class="flex items-center gap-3 text-slate-300 bg-white/5 p-3 rounded-xl">
                    <i class="fa-solid fa-circle-exclamation text-indigo-400"></i>
                    <span id="details-must"></span>
                </div>
            </div>
            
            <button onclick="document.getElementById('details-modal').classList.add('hidden')" 
                    class="btn-main w-full mt-8 py-4 text-lg">סגור</button>
        </div>
    </div>
</div>

<div id="edit-prompt-modal" class="fixed inset-0 z-[3000] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="glass w-full max-w-sm animate-in fade-in duration-300 border border-white/10 p-6 relative">
        <h3 class="text-xl font-black text-white mb-2">עריכה חכמה ⚡</h3>
        <p class="text-xs text-slate-400 mb-4">כתוב שינוי (למשל: "בתל אביב ב-60 שח") או בחר עיר:</p>
        
        <div class="relative w-full mb-6">
            <input id="quick-edit-input" type="text" 
                   class="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-4 text-white focus:ring-2 ring-indigo-500 outline-none" 
                   placeholder="מה תרצה לשנות?" autocomplete="off">
            <div id="city-suggestions" class="absolute top-full left-0 right-0 bg-slate-900 border border-white/10 rounded-xl mt-1 hidden overflow-hidden z-[3100] shadow-2xl"></div>
        </div>
        
        <div class="flex gap-3">
            <button id="btn-quick-confirm" class="btn-main flex-1 py-3 text-sm">עדכן עכשיו</button>
            <button onclick="document.getElementById('edit-prompt-modal').classList.add('hidden')" 
                    class="flex-1 py-3 bg-white/5 rounded-xl text-sm font-bold border border-white/10">ביטול</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
   import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, deleteDoc, doc, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyD0hsz8SOI1OG2Fh-DBy1SHeabPaEKZx-Y", // שים את שלך
        authDomain: "matchme-32bcf.firebaseapp.com",
        projectId: "matchme-32bcf",
        storageBucket: "matchme-32bcf.appspot.com",
        appId: "1:1082863959305:web:f888f4df815598696c601f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let allPosts = [];
let editModeId = null;

    // --- UI MANAGER ---
    window.UI = {
        currentType: 'biz',
        togglePostType(type) {
            this.currentType = type;
            const isBiz = type === 'biz';
            
            document.getElementById('tab-biz').className = isBiz ? 'flex-1 py-3 rounded-xl font-bold tab-active transition-all' : 'flex-1 py-3 rounded-xl font-bold tab-inactive transition-all';
            document.getElementById('tab-user').className = !isBiz ? 'flex-1 py-3 rounded-xl font-bold tab-active bg-green-600' : 'flex-1 py-3 rounded-xl font-bold tab-inactive transition-all';
            
            document.getElementById('p-title').placeholder = isBiz ? "כותרת המשרה (למשל: נהג חלוקה)" : "מי אני? (למשל: נהג ג' פנוי לעבודה)";
        },
        switchProfileTab(tab) {
            const isPosts = tab === 'posts';
            document.getElementById('tab-content-posts').className = isPosts ? 'block' : 'hidden';
            document.getElementById('tab-content-inbox').className = !isPosts ? 'block' : 'hidden';
            
            document.getElementById('subtab-posts').className = isPosts ? 'text-sm font-bold pb-2 text-indigo-400 border-b-2 border-indigo-400' : 'text-sm font-bold pb-2 text-slate-500 border-b-2 border-transparent';
            document.getElementById('subtab-inbox').className = !isPosts ? 'text-sm font-bold pb-2 text-indigo-400 border-b-2 border-indigo-400' : 'text-sm font-bold pb-2 text-slate-500 border-b-2 border-transparent';
            
            if(!isPosts) Data.loadMyInbox();
        }
    };

    // --- CHATBOT (THE NEGOTIATOR) ---
    window.ChatBot = {
        currentPost: null,
        step: 0,
        data: {},
        
        open(post) {
            this.currentPost = post;
            this.step = 0;
            this.data = {};
            document.getElementById('chat-modal').classList.remove('hidden');
            document.getElementById('chat-modal').classList.add('flex');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('chat-subject').innerText = post.title;
            
            const contextText = post.postType === 'user' ? 'אני אעזור לך לבדוק התאמה למועמד.' : `אני הסוכן הדיגיטלי של המשרה.`;
            this.botSay(`היי! ${contextText} בוא נבדוק התאמה זריזה. מוכן?`);
            setTimeout(() => this.nextStep(), 1200);
        },

        close() {
            document.getElementById('chat-modal').classList.add('hidden');
            document.getElementById('chat-modal').classList.remove('flex');
        },

        botSay(text, delay = 0) {
            const area = document.getElementById('chat-messages');
            const typingId = 't-' + Date.now();
            
            setTimeout(() => {
                const typing = document.createElement('div');
                typing.id = typingId;
                typing.className = 'chat-bubble-bot w-16 flex items-center justify-center gap-1';
                typing.innerHTML = '<div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div><div class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></div>';
                area.appendChild(typing);
                area.scrollTop = area.scrollHeight;

                setTimeout(() => {
                    document.getElementById(typingId).remove();
                    const div = document.createElement('div');
                    div.className = 'chat-bubble-bot msg-enter';
                    div.innerHTML = text; // תמיכה ב-HTML
                    area.appendChild(div);
                    area.scrollTop = area.scrollHeight;
                }, 800);
            }, delay);
        },

        userReply() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            const area = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-bubble-user msg-enter ml-auto';
            div.innerText = txt;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            
            input.value = '';
            this.handleInput(txt);
        },

        nextStep() {
            const p = this.currentPost;
            if (this.step === 0) {
                this.botSay(`השאלה הראשונה: <b>${p.mustHave || "האם זה רלוונטי לך?"}</b>`);
            } else if (this.step === 1) {
                this.botSay(`מה ציפיות השכר שלך לשעה? (רשום מספר בבקשה)`);
            } else if (this.step === 2) {
                this.botSay(`מעולה. יש משהו נוסף שחשוב שבעל המודעה ידע עליך?`);
            } else if (this.step === 3) {
                this.botSay("אני מעבד את הנתונים... ⚙️");
                setTimeout(() => this.finishNegotiation(), 1500);
            }
        },

        handleInput(txt) {
            this.data[`step_${this.step}`] = txt;
            
            if (this.step === 0) { 
                if (txt.includes('לא') || txt.includes('אין')) {
                    this.botSay("אני מבין. זה תנאי סף קריטי, אז נראה שזה פחות מתאים כרגע. תודה בכל זאת! 🙏");
                    return;
                }
            }
            this.step++;
            setTimeout(() => this.nextStep(), 800);
        },

        async finishNegotiation() {
            const p = this.currentPost;
            const answers = this.data;
            
            // 1. שמירת הליד במסד הנתונים
            await Data.saveLead(p, answers);

            // 2. יצירת קישור לוואטסאפ
            let waMsg = `*התאמה חדשה מ-MatchMe!* 🤖\n\n`;
            waMsg += `📌 מודעה: *${p.title}*\n`;
            waMsg += `✅ תנאי סף: ${answers['step_0']}\n`;
            waMsg += `💰 שכר: ${answers['step_1']}\n`;
            waMsg += `📝 הערות: ${answers['step_2']}\n`;
            
            const link = `https://wa.me/972${p.phone.replace(/\D/g,'').replace(/^0/,'')}?text=${encodeURIComponent(waMsg)}`;

            this.botSay(`מצאתי התאמה! שמרתי את הפרטים שלך אצל המעסיק.<br><br>כדי לזרז תהליכים, אני ממליץ לשלוח לו גם וואטסאפ עכשיו:`);
            
            setTimeout(() => {
                const area = document.getElementById('chat-messages');
                const btn = document.createElement('div');
                btn.className = 'msg-enter mt-4 text-center';
                btn.innerHTML = `<a href="${link}" target="_blank" class="inline-block bg-green-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-green-600 transition-all transform hover:scale-105 no-underline flex items-center justify-center gap-2"><i class="fa-brands fa-whatsapp text-xl"></i> המשך לוואטסאפ</a>`;
                area.appendChild(btn);
                area.scrollTop = area.scrollHeight;
            }, 1000);
        }
    };

    // --- DATA & LOGIC ---
    window.Router = {
        go(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('v-'+viewId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-indigo-400', 'active', 'text-slate-500'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.add('text-slate-500'));
            
            if(viewId === 'feed') {
                document.querySelector('[onclick="Router.go(\'feed\')"]').classList.add('text-indigo-400', 'active');
                document.querySelector('[onclick="Router.go(\'feed\')"]').classList.remove('text-slate-500');
                Data.loadPosts();
            } else if(viewId === 'profile') {
                document.querySelector('[onclick="Router.go(\'profile\')"]').classList.add('text-indigo-400', 'active');
                document.querySelector('[onclick="Router.go(\'profile\')"]').classList.remove('text-slate-500');
            } else {
                 document.querySelector('[onclick="Router.go(\'post\')"]').classList.remove('text-slate-500');
            }
        }
    };

    window.Data = {    
        async submitPost() {
            if (!currentUser) return alert("חובה להתחבר");
            const btn = document.getElementById('btn-submit');
            const postData = {
                title: document.getElementById('p-title').value,
                location: document.getElementById('p-location').value,
                phone: document.getElementById('p-phone').value,
                maxSalary: document.getElementById('p-salary-max').value,
                mustHave: document.getElementById('p-must-have').value,
                postType: UI.currentType,
                updatedAt: serverTimestamp()
            };
            try {
                if (editModeId) {
                    await updateDoc(doc(db, "smart_posts", editModeId), postData);
                    alert("עודכן בהצלחה! ✅");
                    editModeId = null;
                } else {
                    postData.owner = currentUser.uid;
                    postData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "smart_posts"), postData);
                    alert("פורסם! 🚀");
                }
                this.resetForm();
                Router.go('feed');
            } catch (e) { alert("שגיאה: " + e.message); }
        },

        resetForm() {
            document.querySelector('#v-post h2').innerText = "יצירת כרטיס חכם";
            document.getElementById('btn-submit').innerText = "פרסם עכשיו 🚀";
            document.querySelectorAll('#v-post input').forEach(i => i.value = '');
            editModeId = null;
        },

                // רשימת ערים לזיהוי חכם (Autocomplete)
        ISRAEL_CITIES: ['תל אביב', 'ירושלים', 'חיפה', 'ראשון לציון', 'פתח תקווה', 'אשדוד', 'נתניה', 'בני ברק', 'באר שבע', 'חולון', 'רמת גן', 'אשקלון', 'רחובות', 'בת ים', 'בית שמש', 'כפר סבא', 'הרצליה', 'חדרה', 'מודיעין', 'רעננה', 'רמלה', 'לוד', 'הוד השרון', 'גבעתיים'],

        async editPost(p) {
            const modal = document.getElementById('edit-prompt-modal');
            const input = document.getElementById('quick-edit-input');
            const suggestions = document.getElementById('city-suggestions');
            const confirmBtn = document.getElementById('btn-quick-confirm');
            const modalContainer = modal.querySelector('.glass');
            
            input.value = '';
            suggestions.classList.add('hidden');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // מנגנון הצעות ערים (Autocomplete)
            input.oninput = () => {
                const val = input.value.trim();
                if (val.length < 2) { suggestions.classList.add('hidden'); return; }
                const matches = this.ISRAEL_CITIES.filter(c => c.includes(val)).slice(0, 5);
                if (matches.length > 0) {
                    suggestions.innerHTML = matches.map(m => `<div class="p-3 hover:bg-indigo-600 text-white text-sm cursor-pointer border-b border-white/5">${m}</div>`).join('');
                    suggestions.classList.remove('hidden');
                    suggestions.querySelectorAll('div').forEach(div => {
                        div.onclick = () => { input.value = div.innerText; suggestions.classList.add('hidden'); };
                    });
                } else suggestions.classList.add('hidden');
            };

            confirmBtn.onclick = async () => {
                const note = input.value.trim();
                if (note === "") {
                    modalContainer.classList.add('apply-shake');
                    setTimeout(() => modalContainer.classList.remove('apply-shake'), 400);
                    return; 
                }

                modal.classList.add('hidden');
                let up = {}; let found = false;

                // 1. זיהוי שכר/שעות (מספר)
                const numMatch = note.match(/\d+/);
                if (numMatch && (note.includes("שכר") || note.includes("₪") || note.includes("שח") || note.includes("שעה"))) {
                    up.maxSalary = numMatch[0];
                    found = true;
                }
                // 2. זיהוי עיר מהרשימה
                const city = this.ISRAEL_CITIES.find(c => note.includes(c));
                if (city) { up.location = city; found = true; }
                
                // 3. זיהוי מילות מפתח למשמרות/דרישות
                if (note.includes("בוקר") || note.includes("ערב") || note.includes("משמרת") || note.includes("זמין")) {
                    up.mustHave = note;
                    found = true;
                }

                if (found) {
                    await updateDoc(doc(db, "smart_posts", p.id), up);
                    this.loadPosts();
                    if(this.loadMyHistory) this.loadMyHistory();
                } else { 
                    this.openFullEdit(p); // אם לא זיהינו משהו ספציפי, עוברים לעריכה המלאה
                }
            };
        },

        showDetails(p) {
            const modal = document.getElementById('details-modal');
            document.getElementById('details-title').innerText = p.title;
            document.getElementById('details-loc').innerText = p.location || 'כל הארץ';
            document.getElementById('details-salary').innerText = p.maxSalary || 'לא צוין';
            document.getElementById('details-must').innerText = p.mustHave || 'אין דרישות מיוחדות';
            
            const badge = document.getElementById('details-badge');
            badge.innerText = p.postType === 'user' ? '🙋‍♂️ מחפש עבודה' : '💼 משרה פתוחה';
            badge.className = `mb-4 inline-block px-3 py-1 rounded-full text-[10px] font-bold border ${p.postType === 'user' ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20'}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        },


        // שמירת ליד (פנייה)
        async saveLead(post, answers) {
            try {
                await addDoc(collection(db, "smart_leads"), {
                    postId: post.id,
                    postTitle: post.title,
                    ownerId: post.owner, // למי זה שייך (כדי שיוכל לראות באינבוקס)
                    answers: answers,
                    createdAt: serverTimestamp()
                });
                console.log("Lead saved");
            } catch (e) {
                console.error("Error saving lead", e);
            }
        },

        // טעינת משרות ללוח
        async loadPosts() {
            const list = document.getElementById('feed-list');
            try {
                const q = query(collection(db, "smart_posts"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                allPosts = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                this.renderList(allPosts);
            } catch (e) {
                list.innerHTML = '<div class="text-center py-10 opacity-30">שגיאה בטעינת נתונים</div>';
            }
        },

        renderList(posts) {
            const list = document.getElementById('feed-list');
            if (posts.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-slate-500">לא נמצאו תוצאות 🔍</div>';
                return;
            }

            list.innerHTML = posts.map(p => {
                const isUser = p.postType === 'user';
                const color = isUser ? 'text-green-400' : 'text-indigo-400';
                const badge = isUser ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
                const icon = isUser ? 'fa-user-tie' : 'fa-briefcase';
                
                const isOwner = auth.currentUser && (auth.currentUser.uid === p.owner || auth.currentUser.email === "cifhiim@gmail.com");
                const isAdmin = auth.currentUser && auth.currentUser.email === "cifhiim@gmail.com";

                return `
                    <div class="glass p-5 relative overflow-hidden group msg-enter">
                        <div onclick='Data.showDetails(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="cursor-pointer">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] ${badge} px-2.5 py-1 rounded-md font-bold border flex items-center gap-1">
                                    <i class="fa-solid ${icon}"></i> ${isUser ? 'מחפש עבודה' : 'משרה פעילה'}
                                </span>
                                <span class="text-[10px] text-slate-500">${p.location || 'כל הארץ'}</span>
                            </div>
                            <h3 class="text-xl font-black text-white leading-tight mb-2">${p.title}</h3>
                        </div>
                        
                        <div class="flex gap-2 mt-4 pt-4 border-t border-white/5">
                            <button onclick='ChatBot.open(${JSON.stringify(p).replace(/'/g, "&#39;")})' 
                                    class="flex-1 bg-white/5 py-3 rounded-xl text-sm font-bold border border-white/10 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-comments ${color}"></i> צ'אט
                            </button>
                            
                            ${isOwner ? `
                                <button onclick='Data.editPost(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            ` : ''}

                            ${isAdmin ? `
                                <button onclick="Data.adminDelete('${p.id}')" class="w-12 h-12 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        },



        async loadMyHistory() {
            if(!currentUser) return;
            const q = query(collection(db, "smart_posts"), where("owner", "==", currentUser.uid));
            const snap = await getDocs(q);
            const container = document.getElementById('my-posts');
            
            if(snap.empty) {
                container.innerHTML = '<p class="text-center text-sm opacity-40 py-4">לא פרסמת מודעות</p>';
                return;
            }
            
            container.innerHTML = snap.docs.map(d => {
                const p = { id: d.id, ...d.data() };
                return `
                <div class="bg-slate-800 p-4 rounded-xl border border-white/5 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm text-white">${p.title}</div>
                            <div class="text-[10px] text-slate-400">${p.postType==='biz'?'משרה':'כרטיס עובד'} • ${new Date(p.createdAt?.seconds * 1000).toLocaleDateString()}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='Data.editPost(${JSON.stringify(p).replace(/'/g, "&#39;")})' 
                                    class="w-8 h-8 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="Data.deleteItem('smart_posts', '${d.id}')" 
                                    class="w-8 h-8 rounded-lg bg-red-500/20 text-red-400 flex items-center justify-center border border-red-500/30">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        },


        // טעינת ה-INBOX שלי
        async loadMyInbox() {
            if(!currentUser) return;
            const container = document.getElementById('my-inbox');
            container.innerHTML = '<div class="text-center text-xs opacity-50">טוען הודעות...</div>';

            const q = query(collection(db, "smart_leads"), where("ownerId", "==", currentUser.uid), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            
            if(snap.empty) {
                container.innerHTML = '<p class="text-center text-sm opacity-40 py-4">תיבת ההודעות ריקה</p>';
                return;
            }
            
            container.innerHTML = snap.docs.map(d => {
                const l = d.data();
                const date = l.createdAt ? new Date(l.createdAt.seconds * 1000).toLocaleDateString() : '';
                return `
                    <div class="bg-indigo-900/20 p-4 rounded-xl border border-indigo-500/20">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">בקשר ל: ${l.postTitle}</span>
                            <span class="text-[10px] text-slate-500">${date}</span>
                        </div>
                        <div class="space-y-1 text-xs text-slate-300">
                            <p><b>תשובה 1:</b> ${l.answers.step_0}</p>
                            <p><b>שכר:</b> ${l.answers.step_1}</p>
                            <p><b>הערה:</b> ${l.answers.step_2}</p>
                        </div>
                        <div class="mt-3 flex justify-end">
                             <button onclick="Data.deleteItem('smart_leads', '${d.id}')" class="text-[10px] text-red-400 underline">מחק הודעה</button>
                        </div>
                    </div>`;
            }).join('');
        },
                async adminDelete(id) {
            if(confirm("מנהל, למחוק את המודעה הזו לצמיתות?")) {
                try {
                    await deleteDoc(doc(db, "smart_posts", id));
                    this.loadPosts();
                } catch (e) {
                    alert("שגיאה במחיקה: " + e.message);
                }
            }
        },
        async deleteItem(col, id) {
            if(confirm("למחוק את הפריט לצמיתות?")) {
                await deleteDoc(doc(db, col, id));
                if(col === 'smart_posts') this.loadMyHistory();
                else this.loadMyInbox();
            }
        }
    };

    window.Auth = {
        async login() {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch { alert("פרטים שגויים"); }
        },
        async register() {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            if (p.length < 6) return alert("סיסמה קצרה מדי");
            try { 
                await createUserWithEmailAndPassword(auth, e, p);
                alert("ברוך הבא!");
            } catch (err) { alert(err.message); }
        },
        async logout() { await signOut(auth); location.reload(); }
    };

    // Listeners
    onAuthStateChanged(auth, u => {
        currentUser = u;
        if (u) {
            document.getElementById('u-badge').innerHTML = '<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_10px_#4ade80]" id="u-dot"></div> <span class="text-green-400">מחובר</span>';
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('user-box').classList.remove('hidden');
            document.getElementById('user-email').innerText = u.email;
            document.getElementById('user-initial').innerText = u.email[0].toUpperCase();
            Data.loadMyHistory();
        } else {
            document.getElementById('u-badge').innerHTML = '<div class="w-2 h-2 rounded-full bg-slate-500" id="u-dot"></div> <span>אורח</span>';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('user-box').classList.add('hidden');
        }
        Data.loadPosts();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        const filtered = allPosts.filter(p => 
            (p.title && p.title.toLowerCase().includes(val)) || 
            (p.location && p.location.toLowerCase().includes(val))
        );
        Data.renderList(filtered); 
    });

</script>
